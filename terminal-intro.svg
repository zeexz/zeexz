<svg width="750" height="340" viewBox="0 0 750 340" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Terminal intro animation</title>
  <desc>Animated terminal window typing out a whoami-style introduction for Gihan.</desc>

  <defs>
    <clipPath id="termClip">
      <rect x="0" y="34" width="750" height="306" rx="0"/>
    </clipPath>
  </defs>

  <!-- window -->
  <rect x="0" y="0" width="750" height="340" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- title bar -->
  <rect x="0" y="0" width="750" height="34" rx="10" fill="#161b22"/>
  <rect x="0" y="24" width="750" height="10" fill="#161b22"/>
  <circle cx="24" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="17" r="6" fill="#27c93f"/>
  <text x="375" y="21" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#8b949e">gihan@zeexz: ~</text>

  <g clip-path="url(#termClip)" font-family="Menlo, Consolas, monospace" font-size="15" fill="#c9d1d9">

    <text x="20" y="62" opacity="0">
      <tspan fill="#27c93f">gihan@zeexz</tspan><tspan fill="#c9d1d9">:</tspan><tspan fill="#00f7ef">~</tspan><tspan fill="#c9d1d9">$ whoami</tspan>
      <animate attributeName="opacity" begin="0.2s" dur="0.4s" to="1" fill="freeze"/>
    </text>

    <text x="20" y="90" opacity="0" fill="#c9d1d9">
      &gt; Gihan Hemachandra
      <animate attributeName="opacity" begin="1.1s" dur="0.4s" to="1" fill="freeze"/>
    </text>

    <text x="20" y="118" opacity="0">
      <tspan fill="#27c93f">gihan@zeexz</tspan><tspan fill="#c9d1d9">:</tspan><tspan fill="#00f7ef">~</tspan><tspan fill="#c9d1d9">$ cat role.txt</tspan>
      <animate attributeName="opacity" begin="1.8s" dur="0.4s" to="1" fill="freeze"/>
    </text>

    <text x="20" y="146" opacity="0" fill="#c9d1d9">
      &gt; Computer Science student @ SCU
      <animate attributeName="opacity" begin="2.7s" dur="0.4s" to="1" fill="freeze"/>
    </text>

    <text x="20" y="174" opacity="0">
      <tspan fill="#27c93f">gihan@zeexz</tspan><tspan fill="#c9d1d9">:</tspan><tspan fill="#00f7ef">~</tspan><tspan fill="#c9d1d9">$ ./leakscan --status</tspan>
      <animate attributeName="opacity" begin="3.4s" dur="0.4s" to="1" fill="freeze"/>
    </text>

    <text x="20" y="202" opacity="0" fill="#c9d1d9">
      &gt; scanning filesystem, git history, env vars...
      <animate attributeName="opacity" begin="4.3s" dur="0.4s" to="1" fill="freeze"/>
    </text>

    <text x="20" y="230" opacity="0">
      &gt; <tspan fill="#27c93f">0 secrets found</tspan><tspan fill="#c9d1d9"> — zero network calls made</tspan>
      <animate attributeName="opacity" begin="5.0s" dur="0.4s" to="1" fill="freeze"/>
    </text>

    <text x="20" y="258" opacity="0">
      <tspan fill="#27c93f">gihan@zeexz</tspan><tspan fill="#c9d1d9">:</tspan><tspan fill="#00f7ef">~</tspan><tspan fill="#c9d1d9">$ echo $STACK</tspan>
      <animate attributeName="opacity" begin="5.7s" dur="0.4s" to="1" fill="freeze"/>
    </text>

    <text x="20" y="286" opacity="0" fill="#c9d1d9">
      &gt; Go · Java · Spring Boot · Kotlin · C/C++
      <animate attributeName="opacity" begin="6.6s" dur="0.4s" to="1" fill="freeze"/>
    </text>

    <!-- blinking cursor -->
    <rect x="20" y="298" width="9" height="16" fill="#00f7ef" opacity="0">
      <animate attributeName="opacity" begin="7.3s" dur="0.4s" to="1" fill="freeze"/>
      <animate attributeName="opacity" begin="7.7s" dur="0.9s" values="1;0;1" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
