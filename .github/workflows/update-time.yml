name: Update Sri Lanka Time

on:
  schedule:
    # Runs at minute 0 of every hour
    - cron: '0 * * * *' 
  workflow_dispatch: # Allows manual triggering for testing

# Grant the GITHUB_TOKEN write permissions to push commits
permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # Node 24 compatible

      - name: Set up Python
        uses: actions/setup-python@v6 # Node 24 compatible
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pytz

      - name: Write Python script
        run: |
          cat << 'EOF' > update_time.py
          import datetime
          import pytz
          import re

          tz = pytz.timezone('Asia/Colombo')
          now = datetime.datetime.now(tz)
          
          # Format: Sunday, August 30, 2026 - 14:30 (Sri Lanka Time)
          time_str = now.strftime("%A, %B %d, %Y - %H:%M (Sri Lanka Time)")

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # Replace text between the markers
          pattern = r'(<!-- TIME_START -->\n).*?(\n<!-- TIME_END -->)'
          new_content = re.sub(pattern, f"\\1{time_str}\\2", content, flags=re.DOTALL)

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
          EOF

      - name: Run Python script
        run: python update_time.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v6 # Node 24 compatible
        with:
          commit_message: "chore: auto-update Sri Lanka time in README"
          file_pattern: README.md
