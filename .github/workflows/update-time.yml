name: Update Sri Lanka Time

on:
  schedule:
    # Runs at minute 0 of every hour (e.g., 12:00, 1:00, 2:00)
    - cron: '0 * * * *' 
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Updated to v5 (Node 24 support)
        uses: actions/checkout@v5

      - name: Set up Python
        # Updated to v6 (Node 24 support)
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pytz

      - name: Write Python script
        run: |
          cat << 'EOF' > update_time.py
          import datetime
          import pytz
          import re

          tz = pytz.timezone('Asia/Colombo')
          now = datetime.datetime.now(tz)
          
          # Format includes hours and minutes
          time_str = now.strftime("%A, %B %d, %Y - %H:%M (Sri Lanka Time)")

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          pattern = r'(<!-- TIME_START -->\n).*?(\n<!-- TIME_END -->)'
          new_content = re.sub(pattern, f"\\1{time_str}\\2", content, flags=re.DOTALL)

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
          EOF

      - name: Run Python script
        run: python update_time.py

      - name: Commit and push changes
        # Updated to v6 (Node 24 support)
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: auto-update time"
          file_pattern: README.md
