name: Update Sri Lanka Time

on:
  schedule:
    # Runs every minute
    - cron: '* * * * *' 
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pytz

      - name: Write Python script
        run: |
          cat << 'EOF' > update_time.py
          import datetime
          import pytz
          import re

          tz = pytz.timezone('Asia/Colombo')
          now = datetime.datetime.now(tz)
          
          # Format includes seconds now: e.g., Sunday, August 30, 2026 - 14:30:45
          time_str = now.strftime("%A, %B %d, %Y - %H:%M:%S (Sri Lanka Time)")

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          pattern = r'(<!-- TIME_START -->\n).*?(\n<!-- TIME_END -->)'
          new_content = re.sub(pattern, f"\\1{time_str}\\2", content, flags=re.DOTALL)

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
          EOF

      - name: Run Python script
        run: python update_time.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update time"
          file_pattern: README.md
          # Optional: squash commits to avoid spamming your history too much
          commit_options: '--no-verify' 
