name: Generate Streak Stats

on:
  schedule:
    # Runs once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate streak stats SVG
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          user_id: ${{ secrets.STREAK_USER_ID }}
          theme: radical
          hide_border: true
          type: svg
          output: dist/streak-stats.svg

      - name: Commit and push SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/streak-stats.svg
          git diff --staged --quiet || git commit -m "chore: update streak stats [skip ci]"
          git push
