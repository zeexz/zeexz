name: Update streak stats

on:
  schedule:
    - cron: "0 0 * * *"   # once a day at 00:00 UTC
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab
  push:
    paths:
      - ".github/workflows/streak-stats.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=zeexz&theme=radical&hide_border=true
          path: dist/streak-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/streak-stats.svg
          git commit -m "chore: update streak stats" || exit 0
          git push
